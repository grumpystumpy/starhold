name: assemble-auth-sources
on:
  push:
    paths:
      - ".cursor-staging/auth-ep/READY"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack staged sources
        run: |
          set -euo pipefail
          STAGE=.cursor-staging/auth-ep
          test -f "$STAGE/READY"
          test -f "$STAGE/manifest.json"
          EXPECT=$(python3 -c "import json; print(json.load(open('$STAGE/manifest.json'))['sha256'])")
          NPARTS=$(python3 -c "import json; print(json.load(open('$STAGE/manifest.json'))['nparts'])")
          cat $(printf "$STAGE/part-%03d.b64 " $(seq 0 $((NPARTS-1)))) | tr -d '\n' | base64 -d > /tmp/auth-remaining.tar.gz
          ACTUAL=$(sha256sum /tmp/auth-remaining.tar.gz | awk '{print $1}')
          echo "expect=$EXPECT actual=$ACTUAL"
          test "$EXPECT" = "$ACTUAL"
          tar -xzf /tmp/auth-remaining.tar.gz -C .
          rm -rf .cursor-staging/auth-ep
          rm -f .github/workflows/assemble-auth-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat(auth): accounts + routes + web sources (assembled 1-2/n)"
          git push

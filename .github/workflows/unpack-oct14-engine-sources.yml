name: unpack-oct14-engine-sources
on:
  workflow_dispatch:
  push:
    branches: [cursor/oct14-newbie-pirate-we-d837]
    paths:
      - .github/workflows/unpack-oct14-engine-sources.yml
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/oct14-newbie-pirate-we-d837
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and extract staged sources
        run: |
          set -euo pipefail
          curl -fsSL "https://litter.catbox.moe/u7335l.gz" -o /tmp/rest.tar.gz
          echo "685f052c8d4348c103085a2aceb99d96105576ebe89ffe6caaa6eabab80fe115  /tmp/rest.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rest.tar.gz -C .
      - name: Commit remaining engine sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/game/src/data/tuning.ts \
            packages/game/src/formulas-travel.ts \
            packages/game/src/types-core.ts \
            packages/game/src/types-view.ts \
            packages/game/src/world-launch-target.ts \
            packages/game/src/world-pirates.ts \
            packages/game/src/world-protection.ts \
            packages/game/src/world-view.ts \
            packages/game/src/world.ts
          git commit -m "feat: newbie protection, pirate raid fairness, World Eater -50% speed"
          git add \
            packages/game/src/combat-rounds.test.ts \
            packages/game/src/fleets.test.ts \
            packages/game/src/highscores.test.ts \
            packages/game/src/moons.test.ts \
            packages/game/src/parity-fleet.test.ts \
            packages/game/src/parity-lab.test.ts \
            packages/game/src/protection.test.ts \
            packages/game/src/round2-ships.test.ts \
            packages/game/src/test-graduate.ts
          git commit -m "test: graduate newbie targets in raid fixtures; protection cases"
          git push origin HEAD:cursor/oct14-newbie-pirate-we-d837

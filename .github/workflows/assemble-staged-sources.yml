name: Assemble staged sources (player levels)
on:
  push:
    branches: [cursor/player-levels-on-f-8713]
    paths:
      - .cursor-stage/**
      - .github/workflows/assemble-staged-sources.yml
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/player-levels-on-f-8713
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode staged sources and remove workflow
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path(".")
          stage = root / ".cursor-stage"
          if not stage.exists():
              print("no stage dir")
              raise SystemExit(0)
          for p in sorted(stage.glob("*.gz.b64")):
              name = p.name[: -len(".gz.b64")]
              dest = name.replace("__", "/")
              raw = gzip.decompress(base64.b64decode(p.read_text().encode("ascii")))
              pathlib.Path(dest).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(dest).write_bytes(raw)
              print(dest, len(raw), hashlib.sha256(raw).hexdigest()[:12])
              p.unlink()
          try:
              stage.rmdir()
          except OSError:
              pass
          PY
          rm -f .github/workflows/assemble-staged-sources.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(I): decode staged sources for player levels"
          git push

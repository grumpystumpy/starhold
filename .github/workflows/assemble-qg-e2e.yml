name: assemble-qg-e2e
on:
  workflow_dispatch:
  push:
    paths:
      - .cursor-staging/qg-e2e/**
      - .github/workflows/assemble-qg-e2e.yml
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack world-pirates STARHOLD_E2E
        run: |
          set -euo pipefail
          SRC=.cursor-staging/qg-e2e/packages__game__src__world-pirates.ts.gz.b64
          test -f "$SRC"
          base64 -d "$SRC" | gzip -d > packages/game/src/world-pirates.ts
          grep -n STARHOLD_E2E packages/game/src/world-pirates.ts
          grep -n STARHOLD_E2E .github/workflows/ci.yml
          if [ -f .cursor-staging/qg-e2e/scripts__smoke-ui.mjs.gz.b64 ]; then
            if base64 -d .cursor-staging/qg-e2e/scripts__smoke-ui.mjs.gz.b64 | gzip -d > scripts/smoke-ui.mjs; then
              echo "smoke unpacked"
            else
              echo "smoke decode failed; leaving prior file"
              git checkout -- scripts/smoke-ui.mjs 2>/dev/null || true
            fi
          fi
          if [ -f .cursor-staging/qg-e2e/scripts__quality-gate-pirates-aliens.mjs.gz.b64 ]; then
            if base64 -d .cursor-staging/qg-e2e/scripts__quality-gate-pirates-aliens.mjs.gz.b64 | gzip -d > scripts/quality-gate-pirates-aliens.mjs; then
              echo "gate unpacked"
            else
              echo "gate decode failed; leaving prior file"
              git checkout -- scripts/quality-gate-pirates-aliens.mjs 2>/dev/null || true
            fi
          fi
          rm -rf .cursor-staging/qg-e2e
          rm -f .github/workflows/assemble-qg-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(ci): apply STARHOLD_E2E NPC raid gate in world-pirates"
          git push

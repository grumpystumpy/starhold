name: Assemble Round 3 staged sources (one-shot)

on:
  push:
    branches: [cursor/round3-content-a540]
    paths:
      - ".github/workflows/assemble-r3-sources.yml"
      - ".cursor-stage/r3/**"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/round3-content-a540
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack staged sources
        run: |
          set -euo pipefail
          test -d .cursor-stage/r3
          cat .cursor-stage/r3/*.b64 | tr -d '\n' | base64 -d > /tmp/r3-remaining.tar.gz
          echo "e675ca96b2152261b07bb6c63fb29eb55ed282fb47437469b21bb78c07e21110  /tmp/r3-remaining.tar.gz" | sha256sum -c -
          tar -xzf /tmp/r3-remaining.tar.gz -C .
          rm -rf .cursor-stage/r3
          rm -f .github/workflows/assemble-r3-sources.yml

      - name: Commit unpacked sources and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat(R3): unpack staged Round 3 sources"
          git push origin HEAD:cursor/round3-content-a540

name: assemble-api-bundle
on:
  workflow_dispatch:
  push:
    branches: [cursor/pirates-aliens-redesign-abde]
    paths:
      - .github/workflows/assemble-api-bundle.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pirates-aliens-redesign-abde
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @starhold/game && npm run build -w @starhold/server && node scripts/bundle-api.mjs
      - name: Commit api bundle via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f api/index.js
          python3 <<'PY'
          import base64, json, os, urllib.request, urllib.error
          token = os.environ["GH_TOKEN"]
          path = "api/index.js"
          content = open(path, "rb").read()
          print("bundle_bytes", len(content))
          api = "https://api.github.com/repos/grumpystumpy/starhold"
          branch = "cursor/pirates-aliens-redesign-abde"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "starhold-assemble",
              "Content-Type": "application/json",
          }
          sha = None
          try:
              req = urllib.request.Request(f"{api}/contents/{path}?ref={branch}", headers=headers)
              sha = json.load(urllib.request.urlopen(req))["sha"]
              print("existing sha", sha)
          except urllib.error.HTTPError as e:
              print("no existing", e.code)
          payload = {
              "message": "chore: assemble api/index.js for pirates+aliens redesign",
              "content": base64.b64encode(content).decode(),
              "branch": branch,
          }
          if sha:
              payload["sha"] = sha
          req = urllib.request.Request(
              f"{api}/contents/{path}",
              data=json.dumps(payload).encode(),
              method="PUT",
              headers=headers,
          )
          with urllib.request.urlopen(req) as r:
              meta = json.load(r)
              print("committed", meta.get("commit", {}).get("sha"))
          PY

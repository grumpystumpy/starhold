name: Assemble full #49 stack onto batch-tomorrow-deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-full49
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/cursor/batch-tomorrow-deploy'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: cursor/batch-tomorrow-deploy
      - name: Run assemble script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .cursor-push/assemble-full49.py

name: assemble-smoke-ui
on:
  push:
    paths:
      - ".cursor-stage/assemble-smoke.mjs"
      - ".github/workflows/assemble-smoke-ui.yml"
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/round2-nav-routes-e27b
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble smoke-ui.mjs from base64 parts
        run: |
          set -euo pipefail
          node .cursor-stage/assemble-smoke.mjs
          rm -f .github/workflows/assemble-smoke-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "test(G): smoke-ui nav dropdown and /buildings routes"
          git push origin HEAD:cursor/round2-nav-routes-e27b

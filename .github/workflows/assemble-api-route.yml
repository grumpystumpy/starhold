name: Assemble API route (one-shot)

on:
  push:
    branches: [cursor/round2-j-ships-b40c]
    paths:
      - ".github/workflows/assemble-api-route.yml"
      - "packages/game/**"
      - "apps/server/**"
      - "apps/web/**"
      - "scripts/bundle-api.mjs"
      - "scripts/.j-staging/**"

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/round2-j-ships-b40c
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Unpack staged Micah amendments
        run: |
          if [ -f scripts/.j-staging/unpack-all.mjs ]; then
            node scripts/.j-staging/unpack-all.mjs
          fi
          # Remove staging artifacts (including legacy part files)
          rm -rf scripts/.j-staging

      - name: Install + rebuild API bundle
        run: |
          npm ci
          npm run build -w @starhold/game
          node scripts/bundle-api.mjs

      - name: Commit bundle and remove this workflow
        run: |
          rm -f .github/workflows/assemble-api-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(J): regenerate api route bundle after Micah amendments"
          git push origin HEAD:cursor/round2-j-ships-b40c

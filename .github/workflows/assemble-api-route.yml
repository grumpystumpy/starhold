name: Assemble API route (one-shot)

on:
  push:
    branches: [cursor/pirates-ai-fb21]
    paths:
      - ".github/workflows/assemble-api-route.yml"
      - "packages/game/**"
      - "apps/server/**"
      - "apps/web/**"
      - "scripts/bundle-api.mjs"

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pirates-ai-fb21
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install + rebuild API bundle
        run: |
          npm ci
          npm run build -w @starhold/game
          npm run build -w @starhold/server
          node scripts/bundle-api.mjs

      - name: Commit bundle and remove this workflow
        run: |
          rm -f .github/workflows/assemble-api-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 'api/[[...route]].js' .github/workflows/assemble-api-route.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(E): assemble api/[[...route]].js from pirates tip"
          git push origin HEAD:cursor/pirates-ai-fb21

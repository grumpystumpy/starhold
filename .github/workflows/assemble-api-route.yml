name: Apply XP rebalance staging + assemble API
on:
  push:
    branches: [cursor/xp-rebalance-micah-8713]
jobs:
  apply-and-assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/xp-rebalance-micah-8713
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply staged XP rebalance sources
        run: python3 scripts/apply-xp-rebalance.py
      - run: npm ci
      - run: npm run build:vercel
      - name: Commit sources + bundle; remove staging and workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .cursor-staging/xp-rebalance
          rm -f scripts/apply-xp-rebalance.py
          rm -f .github/workflows/assemble-api-route.yml
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(I): assemble api bundle for XP rebalance"
          git push

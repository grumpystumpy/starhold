name: unpack-oct14-e2e-hooks
on:
  push:
    branches: [cursor/oct14-newbie-pirate-we-d837]
    paths:
      - ".cursor-staging/e2e-hooks/READY"
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/oct14-newbie-pirate-we-d837
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack e2e hook sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/asm
          cat .cursor-staging/e2e-hooks/part-*.txt | tr -d '\n' | base64 -d > /tmp/asm/rest.tgz
          echo "c24623462f4e5fe3e02ef09de3a049216c8cb9ab2170149430fa81405c97fba8  /tmp/asm/rest.tgz" | sha256sum -c
          tar xzf /tmp/asm/rest.tgz -C .
          rm -rf .cursor-staging/e2e-hooks
          rm -f .github/workflows/unpack-oct14-e2e-hooks.yml
          git config user.name "grumpystumpy"
          git config user.email "stumpysgarage@gmail.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "fix(e2e): graduate-newbie API hook + smoke raid graduation"
          git push

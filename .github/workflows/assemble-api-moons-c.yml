name: Assemble API (Thread C one-shot)

on:
  push:
    branches:
      - cursor/moons-moon-buildings-6b05
    paths:
      - ".github/workflows/assemble-api-moons-c.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/moons-moon-buildings-6b05
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:vercel
      - name: Commit assembled api bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "api/[[...route]].js"
          git diff --staged --quiet || git commit -m "chore(C): assemble api/[[...route]].js with moon + sensor phalanx"
          git push
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/assemble-api-moons-c.yml
          git add -A
          git diff --staged --quiet || git commit -m "chore: remove assemble-api-moons-c workflow"
          git push

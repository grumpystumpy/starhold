name: assemble-mini-redesign
on:
  push:
    paths:
      - .github/workflows/assemble-mini-redesign.yml
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/mini-planets-a1aa
      - name: Fetch and unpack sources
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/payload.tar.gz "https://litter.catbox.moe/u7mo8i.gz"
          echo "ff66d97ca142de19960c476186d5d71666960299a50c62d7cfdb346a32151470  /tmp/payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/payload.tar.gz -C .
          rm -f .github/workflows/assemble-mini-redesign.yml
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(K): Micah mini overrides + Fortress jump (±1 galaxy, ±10 accuracy)"
          git push origin HEAD:cursor/mini-planets-a1aa

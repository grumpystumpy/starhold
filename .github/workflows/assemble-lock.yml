name: Assemble package-lock
on:
  push:
    paths:
      - ".package-lock.json.b64gz"
      - "scripts/assemble-lock.mjs"
      - ".github/workflows/assemble-lock.yml"
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: node scripts/assemble-lock.mjs
      - name: Commit package-lock.json
        run: |
          git config user.name "grumpystumpy"
          git config user.email "stumpysgarage@gmail.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json unchanged"
          else
            git commit -m "chore: assemble package-lock.json from compressed staging"
            git push
          fi

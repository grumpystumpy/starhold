name: assemble-naming-16
on:
  push:
    branches: [cursor/oct14-naming-d837]
    paths:
      - ".cursor-staging/naming-16/READY2"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/oct14-naming-d837
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply remaining naming renames in place
        run: |
          set -euo pipefail
          # types / tests / formulas comments & titles
          sed -i 's/Active Swarm Mothership occupations/Active Mothership occupations/' packages/game/src/types-view.ts
          sed -i \
            -e 's/Salvage Trawlers or Swarm Mothership/Salvage Trawlers or Mothership/' \
            -e 's/(Outpost Cradle, Swarm Mothership/(Colonizer, Mothership/' \
            -e 's/ride with a Swarm Mothership/ride with a Mothership/' \
            -e 's/parked Swarm Mothership drone/parked Mothership drone/' \
            -e 's/Swarm Mothership occupation of an enemy/Mothership occupation of an enemy/' \
            packages/game/src/types-core.ts
          sed -i \
            -e 's/"Swarm Mothership is 2nd largest/"Mothership is 2nd largest/' \
            -e 's/"Swarm Mothership can harvest/"Mothership can harvest/' \
            packages/game/src/round2-ships.test.ts
          # fleet composer fmt
          sed -i \
            -e 's/· ${a.richness} left)/· ${fmt(a.richness)} left)/' \
            -e 's/${p.ships\[id\]}×/${fmt(p.ships[id] ?? 0)}×/' \
            apps/web/src/ui/render-fleets-composer.ts
          # vision current-name lines (leave Round 3 goal item 149 intact)
          sed -i \
            -e 's/Voidforge Titan, Outpost Cradle, Salvage/Voidforge Titan, Colonizer, Salvage/' \
            -e 's/must be carried by Swarm Mothership/must be carried by Mothership/' \
            -e 's/\*\*Swarm Mothership\*\* — carry up to 2000/**Mothership** — carry up to 2,000/' \
            docs/vision.md
          # round2 contract current display names
          sed -i \
            -e 's/| \*\*Outpost Cradle\*\* |/| **Colonizer** (was Outpost Cradle) |/' \
            -e 's/(**2000**) Swarm Mothership capacity/(**2,000**) Mothership capacity/' \
            -e 's/Colonize with \*\*Outpost Cradle\*\*/Colonize with **Colonizer**/' \
            -e 's/carried\*\* by Swarm Mothership/carried** by Mothership/' \
            -e 's/### 7.5 Swarm Mothership/### 7.5 Mothership/' \
            -e 's/### 7.6 Occupation (Swarm Mothership)/### 7.6 Occupation (Mothership)/' \
            -e 's/at least one Swarm Mothership remains/at least one Mothership remains/' \
            docs/design/round2-contract.md
          # cleanup staging + this workflow
          rm -rf .cursor-staging/naming-16
          git config user.name "grumpystumpy"
          git config user.email "stumpysgarage@gmail.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "fix: naming consistency — remaining types/docs/UI (sed assemble)"
          git push

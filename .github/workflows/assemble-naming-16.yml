name: assemble-naming-16
on:
  push:
    branches: [cursor/oct14-naming-d837]
    paths:
      - ".cursor-staging/naming-16/READY2"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/oct14-naming-d837
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply remaining naming renames
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, pairs: list[tuple[str, str]]) -> None:
              p = Path(path)
              text = p.read_text()
              orig = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing pattern in {path}: {old!r}")
                  text = text.replace(old, new)
              if text == orig:
                  raise SystemExit(f"no changes for {path}")
              p.write_text(text)
              print(f"updated {path}")

          replace("packages/game/src/types-view.ts", [
              ("Active Swarm Mothership occupations", "Active Mothership occupations"),
          ])
          replace("packages/game/src/types-core.ts", [
              ("Salvage Trawlers or Swarm Mothership", "Salvage Trawlers or Mothership"),
              ("(Outpost Cradle, Swarm Mothership", "(Colonizer, Mothership"),
              ("ride with a Swarm Mothership", "ride with a Mothership"),
              ("parked Swarm Mothership drone", "parked Mothership drone"),
              ("Swarm Mothership occupation of an enemy", "Mothership occupation of an enemy"),
          ])
          replace("packages/game/src/round2-ships.test.ts", [
              ('"Swarm Mothership is 2nd largest', '"Mothership is 2nd largest'),
              ('"Swarm Mothership can harvest', '"Mothership can harvest'),
          ])
          replace("apps/web/src/ui/render-fleets-composer.ts", [
              ("· ${a.richness} left)", "· ${fmt(a.richness)} left)"),
              ("${p.ships[id]}×${SHIPS[id].name}", "${fmt(p.ships[id] ?? 0)}×${SHIPS[id].name}"),
          ])
          replace("docs/vision.md", [
              ("Voidforge Titan, Outpost Cradle, Salvage", "Voidforge Titan, Colonizer, Salvage"),
              ("must be carried by Swarm Mothership", "must be carried by Mothership"),
              ("**Swarm Mothership** — carry up to 2000", "**Mothership** — carry up to 2,000"),
          ])
          replace("docs/design/round2-contract.md", [
              ("| `colonyShip` | Colony Ship | **Outpost Cradle** |", "| `colonyShip` | Colony Ship | **Colonizer** (was Outpost Cradle) |"),
              ("+15% of base (**2000**) Swarm Mothership capacity per level", "+15% of base (**2,000**) Mothership capacity per level"),
              ("Colonize with **Outpost Cradle**", "Colonize with **Colonizer**"),
              ("Must be carried** by Swarm Mothership", "Must be carried** by Mothership"),
              ("### 7.5 Swarm Mothership (`swarmMothership`)", "### 7.5 Mothership (`swarmMothership`)"),
              ("### 7.6 Occupation (Swarm Mothership)", "### 7.6 Occupation (Mothership)"),
              ("at least one Swarm Mothership remains", "at least one Mothership remains"),
          ])
          PY
          rm -rf .cursor-staging/naming-16
          git config user.name "grumpystumpy"
          git config user.email "stumpysgarage@gmail.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "fix: naming consistency — remaining types/docs/UI (assembled)"
          git push

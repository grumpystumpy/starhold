# Deploys the Workers host. Push to main only, and only when the repository
# variable CLOUDFLARE_DEPLOY_ENABLED is true. No pull-request, branch, or
# preview deploys. The job does not start until Micah sets that variable.
name: Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Decide whether this run may deploy
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset; skipping deploy."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build client
        if: steps.gate.outputs.enabled == 'true'
        run: npm run build -w @starhold/game && npm run build -w @starhold/web

      - name: Apply D1 migrations and deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply starhold --remote
          npx wrangler deploy

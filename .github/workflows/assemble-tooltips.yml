name: assemble-tooltips
on:
  push:
    paths:
      - ".github/workflows/assemble-tooltips.yml"
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/oct14-tooltips-d837
          fetch-depth: 0
      - name: Download and unpack tip surfaces
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/tip.tgz "https://litter.catbox.moe/x0df8y.tgz"
          echo "85f4dd4004aa0ba7d11622b42d6c79481bfd8f48b99c214ef4eff2527dc854e5  /tmp/tip.tgz" | sha256sum -c
          tar xzf /tmp/tip.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/ui/styles-shell.css \
            apps/web/src/ui/styles-panels.css \
            apps/web/src/ui/render-chrome-rows.ts \
            apps/web/src/ui/render-chrome-join.ts \
            apps/web/src/ui/render-officers-skills.ts \
            apps/web/src/ui/render-fleets-composer.ts \
            apps/web/src/ui/render-fleets-panels.ts \
            apps/web/src/ui/render-pages.ts \
            apps/web/src/ui/render-shell.ts
          git status
          git diff --cached --stat
          git commit -m "feat(ui): tooltip coverage on officers/fleet/galaxy/stats"
          git push origin HEAD:cursor/oct14-tooltips-d837

name: fix-smoke-ui
on:
  push:
    branches: [cursor/ui-ogame-layout-rebased-5ee3]
    paths:
      - ".github/agent-staging/smoke-b64-3.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/ui-ogame-layout-rebased-5ee3
      - name: Apply
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, hashlib
          parts = [pathlib.Path(f".github/agent-staging/smoke-b64-{i}.txt").read_text().strip() for i in range(4)]
          data = base64.b64decode("".join(parts))
          pathlib.Path("scripts/smoke-ui.mjs").write_bytes(data)
          print("wrote", len(data), hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-ui.mjs
          git commit -m "fix(B): restore smoke-ui.mjs after assemble corruption"
          git push origin HEAD:cursor/ui-ogame-layout-rebased-5ee3
          rm -rf .github/agent-staging
          rm -f .github/workflows/fix-smoke-ui.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove smoke-fix staging"
            git push origin HEAD:cursor/ui-ogame-layout-rebased-5ee3
          fi

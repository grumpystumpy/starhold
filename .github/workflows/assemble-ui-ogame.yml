name: assemble-ui-ogame
on:
  push:
    branches: [cursor/ui-ogame-layout-rebased-5ee3]
    paths:
      - ".github/agent-staging/ui-ogame-payload.b64"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/ui-ogame-layout-rebased-5ee3
          fetch-depth: 0
      - name: Decode and commit UI files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, tarfile, pathlib
          raw = pathlib.Path(".github/agent-staging/ui-ogame-payload.b64").read_text().strip()
          data = base64.b64decode(raw)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tar:
              names = tar.getnames()
              tar.extractall(".")
          print("extracted", len(names), "files")
          for n in names:
              print(" ", n)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.ts apps/web/src/ui/render-chrome-join.ts apps/web/src/ui/render-chrome-rows.ts apps/web/src/ui/render-shell.ts apps/web/src/ui/render-fleets-panels.ts apps/web/src/ui/styles-shell.css apps/web/src/ui/render-pages.ts scripts/smoke-ui.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(B): classic OGame UI layout (rebased on main+E) (assemble)"
            git push origin HEAD:cursor/ui-ogame-layout-rebased-5ee3
          fi
          rm -f .github/agent-staging/ui-ogame-payload.b64
          rm -f .github/workflows/assemble-ui-ogame.yml
          rmdir .github/agent-staging 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
          else
            git commit -m "chore: remove ui-ogame assemble staging"
            git push origin HEAD:cursor/ui-ogame-layout-rebased-5ee3
          fi

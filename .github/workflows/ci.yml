name: CI

# GitHub Actions only. Never deploy from this workflow and never call the
# Wrangler, a deploy hook, or a Cloudflare API token here.
# Deploys are separate (see docs/hosting.md) and need Micah's approval.
#
# Runs once per PR (pull_request) and once per push to main. Pushing to a
# feature branch without a PR does not run CI, so each PR is not tested twice.
# The job name `unit-and-e2e` is the required check in the protect-main
# ruleset; keep it unchanged.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start API + static
        env:
          # Skip NPC raid combat so e2e metal bank is not drained by ~200 hourly pirates.
          STARHOLD_E2E: "1"
          ALLOW_E2E_HOOKS: "1"
          PORT: "3001"
        run: |
          npm start &
          echo $! > /tmp/starhold-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/health >/dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to become healthy"
          exit 1

      - name: Playwright e2e (Upgrade, Shipyard, fleets)
        env:
          STARHOLD_WEB: http://127.0.0.1:3001
          STARHOLD_API: http://127.0.0.1:3001
          STARHOLD_E2E: "1"
          ALLOW_E2E_HOOKS: "1"
        run: npm run e2e

      - name: Playwright layout check (overlap / overflow / screenshots)
        env:
          STARHOLD_WEB: http://127.0.0.1:3001
          STARHOLD_API: http://127.0.0.1:3001
          STARHOLD_E2E: "1"
          ALLOW_E2E_HOOKS: "1"
          UI_REVIEW_OUT: ui-review-out
          UI_REVIEW_BASELINE_DIR: scripts/ui-review-baselines
          UI_REVIEW_FAIL_ON: overlap,overflow,forbidden,contrast,screenshot,overlap-img-text,screenshot-diff
          UI_REVIEW_MAX_DIFF_RATIO: "0.08"
        run: npm run e2e:layout

      - name: Upload layout review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-layout-review
          path: ui-review-out/
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/starhold-server.pid ]; then
            kill "$(cat /tmp/starhold-server.pid)" || true
          fi

  tuning-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Diff tuning.ts vs base
        env:
          TUNING_DIFF_OUT: tuning-diff.md
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/tuning-diff.mjs --base "origin/${{ github.base_ref }}" --head HEAD

      - name: Comment tuning diff on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- starhold-tuning-diff -->";
            const body = fs.readFileSync("tuning-diff.md", "utf8");
            if (!body.includes(marker)) {
              core.setFailed("tuning-diff.md missing marker");
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) =>
              (c.body || "").includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated tuning-diff comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info("Created tuning-diff comment");
            }

name: apply pirates-aliens redesign payload
on:
  workflow_dispatch:
  push:
    branches: [cursor/pirates-aliens-redesign-abde]
    paths:
      - .github/workflows/apply-redesign-payload.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pirates-aliens-redesign-abde
          fetch-depth: 0
      - name: Unpack payload and commit batches
        run: |
          set -euo pipefail
          test -f .cursor-push/CHUNK_COUNT
          python3 <<'PATCH'
          from pathlib import Path
          fixes = {
              ".cursor-push/redesign-part-08.b64": {3801: "L", 3833: "r"},
              ".cursor-push/redesign-part-29.b64": {2539: "S"},
              ".cursor-push/redesign-part-30.b64": {1326: "6"},
          }
          for path, positions in fixes.items():
              p = Path(path)
              data = bytearray(p.read_bytes().strip())
              for idx, ch in positions.items():
                  data[idx] = ord(ch)
              p.write_bytes(bytes(data))
              print(f"patched {path}")
          PATCH
          cat .cursor-push/redesign-part-*.b64 | tr -d '\n' | base64 -d > /tmp/redesign.tar.gz
          echo "33a3e5f893ff89406f1a15490797d6403a6c62498c139534406ff67af898ed59  /tmp/redesign.tar.gz" | sha256sum -c -
          mkdir -p /tmp/extract
          tar -xzf /tmp/redesign.tar.gz -C /tmp/extract
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          import json, os, shutil, subprocess
          batches = json.load(open(".cursor-push/batches-meta.json"))
          root = "/tmp/extract"
          for b in batches:
              for path in b["paths"]:
                  src = os.path.join(root, path)
                  dst = path
                  parent = os.path.dirname(dst)
                  if parent:
                      os.makedirs(parent, exist_ok=True)
                  shutil.copyfile(src, dst)
                  subprocess.check_call(["git", "add", "--", dst])
              st = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if st.returncode != 0:
                  subprocess.check_call(["git", "commit", "-m", b["message"]])
          subprocess.check_call(["git", "rm", "-r", "--ignore-unmatch", ".cursor-push"])
          st = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if st.returncode != 0:
              subprocess.check_call(["git", "commit", "-m", "chore: remove redesign upload payload"])
          PY
          git push origin HEAD:cursor/pirates-aliens-redesign-abde

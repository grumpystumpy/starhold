name: Rebuild API bundle (one-shot)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/moons-moon-buildings-rebased-6b05
    paths:
      - .github/workflows/rebuild-api-bundle-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:vercel
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "api/[[...route]].js"
          git diff --staged --quiet || git commit -m "chore: CI rebuild api bundle (moons + pirates)"
          git push
      - name: Remove one-shot workflow
        run: |
          git rm -f .github/workflows/rebuild-api-bundle-once.yml
          git commit -m "chore: remove one-shot api rebuild workflow" || true
          git push || true
# worker retrigger

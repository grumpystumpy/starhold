name: Assemble batch-tomorrow 53

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-batch-tomorrow-53
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/cursor/batch-tomorrow-deploy'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/batch-tomorrow-deploy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download unpack verify and commit via Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STACK_URL: https://n.uguu.se/vZvJzaKM.tgz
          EXPECT_SHA256: 475e1203f7d994a6b1a46b67d655bd7fffc720150d9909ae0b106d008db2a320
        run: |
          set -euo pipefail
          curl -fsSL "$STACK_URL" -o /tmp/stack.tgz
          echo "$EXPECT_SHA256  /tmp/stack.tgz" | sha256sum -c -
          mkdir -p /tmp/stack
          tar xzf /tmp/stack.tgz -C /tmp/stack
          test -f /tmp/stack/apps/web/src/ui/format.test.ts
          test -f /tmp/stack/apps/web/src/main-actions-build.ts
          grep -q 'format.test.ts' /tmp/stack/apps/web/package.json
          grep -q 'Colonizer' /tmp/stack/docs/vision.md
          grep -q 'Active Mothership occupations' /tmp/stack/packages/game/src/types-view.ts
          python3 <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from pathlib import Path

          TOKEN = os.environ["GH_TOKEN"]
          OWNER, REPO, BRANCH = "grumpystumpy", "starhold", "cursor/batch-tomorrow-deploy"
          API = f"https://api.github.com/repos/{OWNER}/{REPO}"
          MSG = "integrate: fold #53 naming consistency onto batch-tomorrow-deploy"

          def api(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(
                  API + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "starhold-assemble-53",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  raise SystemExit(f"API {method} {path} -> {e.code}: {err}") from e

          def get_json(path):
              return api("GET", path)[1]

          def path_exists(path):
              try:
                  api("GET", f"/contents/{path}?ref={BRANCH}")
                  return True
              except SystemExit as e:
                  if "404" in str(e):
                      return False
                  raise

          ref = get_json(f"/git/ref/heads/{BRANCH}")
          head_sha = ref["object"]["sha"]
          commit = get_json(f"/git/commits/{head_sha}")
          base_tree = commit["tree"]["sha"]

          root = Path("/tmp/stack")
          tree = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rel = str(path.relative_to(root))
              raw = path.read_bytes()
              b64 = base64.b64encode(raw).decode()
              st, blob = api("POST", "/git/blobs", {"content": b64, "encoding": "base64"})
              tree.append({"path": rel, "mode": "100644", "type": "blob", "sha": blob["sha"]})
              print(f"blob {rel} {len(raw)} {blob['sha'][:8]}")

          wf = ".github/workflows/assemble-batch-tomorrow-53.yml"
          if path_exists(wf):
              tree.append({"path": wf, "mode": "100644", "type": "blob", "sha": None})
              print(f"delete {wf}")

          st, new_tree = api("POST", "/git/trees", {"base_tree": base_tree, "tree": tree})
          st, new_commit = api(
              "POST",
              "/git/commits",
              {"message": MSG, "tree": new_tree["sha"], "parents": [head_sha]},
          )
          st, updated = api(
              "PATCH",
              f"/git/refs/heads/{BRANCH}",
              {"sha": new_commit["sha"], "force": False},
          )
          print("COMMIT", new_commit["sha"])
          print("REF", updated["object"]["sha"])
          PY

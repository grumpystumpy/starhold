name: assemble-batch-40-43-api
on:
  push:
    paths:
      - ".github/workflows/assemble-batch-40-43-api.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/batch-40-43-7401
          fetch-depth: 0
      - name: Download api and commit
        env:
          API_URL: https://litter.catbox.moe/j9y16h.js
          API_SHA: 4f75f91055577e3aea7deee61389a136c6ea8c4d736b5953f14c224f4d8b1a58
        run: |
          set -euo pipefail
          mkdir -p api
          curl -fsSL "$API_URL" -o api/index.js
          GOT="$(sha256sum api/index.js | awk '{print $1}')"
          echo "expect=$API_SHA got=$GOT"
          test "$GOT" = "$API_SHA"
          test "$(wc -c < api/index.js)" -ge 500000
          ! grep -q 'SIZE_PROBE_ONLY' api/index.js
          ! grep -q 'PLACEHOLDER_TOO_LARGE_FOR_MCP' api/index.js
          rm -f .github/workflows/assemble-batch-40-43-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "integrate: batch #40–#43 bundled api/index.js"
          git push origin HEAD:cursor/batch-40-43-7401

name: Unpack staged player-levels sources
on:
  push:
    branches: [cursor/player-levels-xp-8713]
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/player-levels-xp-8713
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack gzip+base64 staged files
        run: |
          set -euo pipefail
          test -f .mcp-stage/manifest.json
          python3 .mcp-stage/unpack.py
          rm -rf .mcp-stage
          rm -f .github/workflows/unpack-staged-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "feat(I): unpack staged player-levels sources"
          git push

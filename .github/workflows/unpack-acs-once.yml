name: unpack-acs-once
on:
  push:
    paths:
      - ".github/workflows/unpack-acs-once.yml"
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/acs-joint-fleets-638f
      - name: Assemble ACS tip from chunked payload
        run: |
          set -euo pipefail
          cat .ci-tmp/acs/part-* > /tmp/acs.b64
          base64 -d /tmp/acs.b64 > /tmp/acs-joint.tgz
          tar -xzf /tmp/acs-joint.tgz -C .
          rm -rf .ci-tmp/acs /tmp/acs.b64 /tmp/acs-joint.tgz
          rm -f .github/workflows/unpack-acs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(acs): Joint Strike same-alliance synced raids"
            git push origin HEAD:cursor/acs-joint-fleets-638f
          fi

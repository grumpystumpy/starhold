name: unpack-app-ts
on:
  push:
    paths:
      - ".cursor-stage/round3-app/**"
      - "scripts/unpack-staged-app.py"
      - ".github/workflows/unpack-app-ts.yml"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: python3 scripts/unpack-staged-app.py

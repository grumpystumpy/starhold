name: assemble-alliances-once
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/assemble-alliances-once.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/alliances-4bd8
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and extract full tip
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/alliances-full.tgz "https://litter.catbox.moe/tn90w9.tgz"
          tar -tzf /tmp/alliances-full.tgz | head
          tar -xzf /tmp/alliances-full.tgz -C .
          test -f packages/game/src/world-alliances.ts
          test -f apps/web/src/ui/render-alliances.ts
          grep -q AllianceRecord packages/game/src/types-view.ts
          grep -q ALLIANCE_TAG_MIN packages/game/src/data/tuning.ts
          grep -q '/api/alliance/create' apps/server/src/app.ts
          grep -q alliancesPageHtml apps/web/src/ui/render-pages.ts
          # bundled api must include alliance routes
          grep -q '/api/alliance/create' api/index.js
      - name: Commit full tip
        run: |
          set -euo pipefail
          git config user.name "grumpystumpy"
          git config user.email "328746217+grumpystumpy@users.noreply.github.com"
          git add -A
          git status --short | head -40
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(alliances): complete foundation tip (types, API, UI, bundle)"
            git push origin HEAD:cursor/alliances-4bd8
          fi
      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          if [ -f .github/workflows/assemble-alliances-once.yml ]; then
            git rm -f .github/workflows/assemble-alliances-once.yml
            git commit -m "ci: remove alliances one-shot assemble workflow" || true
            git push origin HEAD:cursor/alliances-4bd8 || true
          fi

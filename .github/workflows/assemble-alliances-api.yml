name: assemble-alliances-api
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/assemble-alliances-api.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/alliances-4bd8
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch api bundle
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/api-index.js.gz "https://litter.catbox.moe/8ukpeh.gz"
          gunzip -c /tmp/api-index.js.gz > api/index.js
          test -s api/index.js
          grep -q '/api/alliance/create' api/index.js
          grep -q AllianceRecord packages/game/src/types-view.ts
          test -f apps/web/src/ui/render-alliances.ts
      - name: Commit api bundle and cleanup workflows
        run: |
          set -euo pipefail
          git config user.name "grumpystumpy"
          git config user.email "328746217+grumpystumpy@users.noreply.github.com"
          rm -f .github/workflows/assemble-alliances-once.yml .github/workflows/assemble-alliances-api.yml || true
          git add -A api/index.js .github/workflows || true
          git status --short | head -20
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(alliances): land api/index.js bundle + cleanup assemble workflows"
            git push origin HEAD:cursor/alliances-4bd8
          fi

name: Assemble batch-tomorrow 52

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-batch-tomorrow-52
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/cursor/batch-tomorrow-deploy'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and unpack #52 stack
        env:
          STACK_URL: https://litter.catbox.moe/b760l4.tgz
          EXPECT_SHA256: 82092e126339c10f682b9a2d383bb79d24fd5db73e68ebb9bf8e76dcc250255b
        run: |
          set -euo pipefail
          curl -fsSL "$STACK_URL" -o /tmp/stack.tgz
          echo "$EXPECT_SHA256  /tmp/stack.tgz" | sha256sum -c -
          tar xzf /tmp/stack.tgz -C .
          test -f packages/game/src/combat-share.ts
          test -f scripts/quality-gate-battle-reports.mjs
          grep -q 'combatBattleExtrasHtml' apps/web/src/ui/render-fleets-panels.ts
          grep -q 'combatBattleExtrasHtml' apps/web/src/ui/render-messages.ts
          grep -q 'nav-messages' scripts/quality-gate-battle-reports.mjs
          grep -q 'roundLog' packages/game/src/types-view.ts
          grep -q 'miniResolveAvailable' packages/game/src/types-view.ts
          grep -q 'e2e/grant' apps/server/src/app.ts
          grep -q 'discover-mini' apps/server/src/app.ts

      - name: Commit stacked files and self-delete workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/assemble-batch-tomorrow-52.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m 'integrate: fold #52 battle reports onto batch-tomorrow-deploy'
          git push origin HEAD:cursor/batch-tomorrow-deploy

name: assemble-round3-remaining
on:
  push:
    paths:
      - .cursor-stage/**
      - .github/workflows/assemble-round3-remaining.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/round3-fastlane-ui-rebased-e1cf
      - name: Unpack staged files
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, pathlib, re
          stage = pathlib.Path(".cursor-stage")
          def cat(prefix):
            parts = sorted(
              p for p in stage.glob(prefix + ".*.b64")
              if re.fullmatch(prefix + r"\.\d{2}\.b64", p.name)
            )
            if not parts:
              return None
            return "".join(p.read_text().strip() for p in parts)
          mapping = {
            "app": "apps/server/src/app.ts",
            "layout": "scripts/ui-layout-check.mjs",
          }
          for prefix, dest in mapping.items():
            b64 = cat(prefix)
            if not b64:
              raise SystemExit(f"missing staged parts for {prefix}")
            data = gzip.decompress(base64.b64decode(b64.encode()))
            pathlib.Path(dest).write_bytes(data)
            print("wrote", dest, len(data))
          PY
      - name: Commit unpacked files and cleanup
        run: |
          set -euo pipefail
          rm -rf .cursor-stage
          rm -f .github/workflows/assemble-round3-remaining.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "feat(round3): unpack app.ts renamePlanet + layout forbidden labels" || exit 0
          git push

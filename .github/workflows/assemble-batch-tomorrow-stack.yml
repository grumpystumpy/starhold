name: Assemble batch-tomorrow stack (#45+#47)

on:
  push:
    paths:
      - .github/workflows/assemble-batch-tomorrow-stack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/batch-tomorrow-deploy
          fetch-depth: 0

      - name: Download + unpack stacked tip
        env:
          STACK_URL: https://litter.catbox.moe/1dk2xn.tgz
          EXPECT_SHA256: f1b969ae903b4c86c78b506f00b63287d338a6d3951f783cd84620ac63460071
        run: |
          set -euo pipefail
          curl -fsSL "$STACK_URL" -o /tmp/stack.tgz
          echo "$EXPECT_SHA256  /tmp/stack.tgz" | sha256sum -c -
          tar xzf /tmp/stack.tgz -C .
          # Refuse leftover placeholder / incomplete tip
          if grep -qx 'PLACEHOLDER' apps/web/package.json; then
            echo 'apps/web/package.json still PLACEHOLDER' >&2
            exit 1
          fi
          test -f scripts/tuning-diff.mjs
          test -f scripts/quality-gate-messages.mjs
          test -f apps/web/src/ui/render-messages.ts
          grep -q 'tuning-diff' package.json
          grep -q 'messagesPageHtml' apps/web/src/ui/render-pages.ts
          grep -q 'hostileInboundHtml' apps/web/src/ui/render-pages.ts

      - name: Commit stacked files and self-delete workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/assemble-batch-tomorrow-stack.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
integrate: fold #45 tuning-diff CI + #47 Messages onto batch-tomorrow-deploy

Stack onto #48 (#40–#43). Keep e2e:gate + hostile-inbound; Messages replaces
Fleet report lists. Conflict resolutions on integrate only.
EOF
)"
          git push origin HEAD:cursor/batch-tomorrow-deploy

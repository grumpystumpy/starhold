name: Assemble Round 3 remaining sources (one-shot)
on:
  push:
    branches: [cursor/round3-content-rebased-a540]
    paths:
      - ".github/workflows/assemble-r3-remaining.yml"
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/round3-content-rebased-a540
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and unpack Round 3 remaining sources
        run: |
          set -euo pipefail
          curl -fsSL "https://litter.catbox.moe/lb3prc.gz" -o /tmp/r3-remaining.tar.gz
          echo "8257739b7b2f25761aea343aca8fe059ca4335134da1dd81b2301900cff00e7d  /tmp/r3-remaining.tar.gz" | sha256sum -c -
          tar -xzf /tmp/r3-remaining.tar.gz -C .
          rm -rf .cursor-staging/r3-rebased .cursor-staging/r3-rebased-v2
          rm -f .github/workflows/assemble-r3-remaining.yml
      - name: Commit unpacked sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat(R3): unpack remaining Round 3 sources (010-063)"
          git push origin HEAD:cursor/round3-content-rebased-a540
